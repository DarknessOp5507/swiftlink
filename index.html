<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAKSHYA | SwiftLink Pro</title>
    <style>
        :root { --main: #00d2ff; --bg: #050505; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #111; border: 1px solid var(--main); padding: 35px; border-radius: 20px; text-align: center; width: 360px; box-shadow: 0 10px 40px rgba(0, 210, 255, 0.3); }
        h1 { color: var(--main); letter-spacing: 5px; margin: 0; font-size: 35px; text-shadow: 0 0 15px rgba(0,210,255,0.5); }
        .badge { background: var(--main); color: black; font-size: 10px; padding: 3px 10px; border-radius: 20px; font-weight: bold; }
        input { width: 100%; padding: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 12px; margin: 25px 0 15px 0; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--main); box-shadow: 0 0 10px rgba(0,210,255,0.2); }
        button#actionBtn { width: 100%; padding: 15px; background: var(--main); color: black; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button#actionBtn:hover { transform: scale(1.02); background: white; }
        #result { margin-top: 25px; display: none; padding: 20px; background: #1a1a1a; border-radius: 15px; border: 1px dashed var(--main); animation: slideUp 0.4s; }
        @keyframes slideUp { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }
        .short-url-text { color: var(--main); font-size: 20px; font-weight: bold; word-break: break-all; text-decoration: none; display: block; margin-bottom: 15px; }
        .btn-row { display: flex; gap: 10px; }
        .btn-row button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--main); background: transparent; color: var(--main); cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-row button:hover { background: var(--main); color: black; }
    </style>
</head>
<body>

<div class="card">
    <span class="badge">INSTANT REDIRECT</span>
    <h1>LAKSHYA</h1>
    <p style="color: #666; font-size: 11px; margin-top: 8px;">No Waiting • No Ads • Personal Tool</p>
    
    <input type="url" id="longUrl" placeholder="Paste your link here...">
    <button id="actionBtn" onclick="process()">SHORTEN & GO</button>

    <div id="result">
        <p style="font-size: 11px; color: #888; margin-bottom: 10px;">Aapka Instant Link:</p>
        <a id="displayUrl" class="short-url-text" href="#" target="_blank"></a>
        <div class="btn-row">
            <button onclick="copyIt()">COPY</button>
            <button onclick="openIt()">OPEN NOW</button>
        </div>
    </div>
</div>

<script>
    async function process() {
        const input = document.getElementById('longUrl').value;
        const btn = document.getElementById('actionBtn');
        const resDiv = document.getElementById('result');

        if(!input || !input.startsWith('http')) {
            alert("Sahi link dalein (http/https ke saath)!");
            return;
        }

        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            // Hum is.gd use kar rahe hain jo seedha redirect karta hai bina "Continue" button ke
            const response = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(input)}`);
            const data = await response.json();
            
            if (data.shorturl) {
                document.getElementById('displayUrl').innerText = data.shorturl;
                document.getElementById('displayUrl').href = data.shorturl;
                resDiv.style.display = 'block';
            } else {
                alert("Error: Link generate nahi ho paya.");
            }
        } catch (e) {
            // Fallback: Agar upar wala fail ho jaye toh dusra method
            alert("Server Error! Dobara koshish karein.");
        } finally {
            btn.innerText = "SHORTEN & GO";
            btn.disabled = false;
        }
    }

    function copyIt() {
        const text = document.getElementById('displayUrl').innerText;
        navigator.clipboard.writeText(text);
        alert("LAKSHYA: Link Copied!");
    }

    function openIt() {
        const url = document.getElementById('displayUrl').href;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
